plugins {
    id 'java'
}

group = 'ca.ucalgary.seng300'
version = '0.1.0'

// Compile for Java 17 so the jar runs on Java 17 or newer (CI uses 21).
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

// `java -jar build/libs/study-room-0.1.0.jar` runs Step1_LibraryApi.
jar {
    manifest {
        attributes 'Main-Class': 'Step1_LibraryApi'
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}
